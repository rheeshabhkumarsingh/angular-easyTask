@if (isAddingTask) {
    <app-new-task [userId]="userDetail.id" (cancel)="onCancelAddTask()"></app-new-task>
}
<section id="tasks">
    <header>
        <h2>{{userDetail.name}}'s Tasks</h2>
        <menu>
            <button (click)="onStartAddTask()">Add Task</button>
        </menu>
    </header>

    <ul>
        @for (task of selectedUserTask; track task.id){
            <li>
                <app-task [task]="task" (complete)="completeTask($event)"></app-task>
            </li>
        }
    </ul>
</section>
