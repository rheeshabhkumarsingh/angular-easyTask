<app-header />

<main>
    <ul id="users">
        @for (user of users; track user.id) {
            <li>
                <app-user [user]="user" [selected]="user.id === selectedUserDetail.id" (selectedUser)="onUserSelect($event)"></app-user>
            </li>
        }
    </ul>
    <app-tasks [userDetail]="selectedUserDetail"></app-tasks>
</main>
